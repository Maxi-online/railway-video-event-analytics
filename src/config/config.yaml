# --------------------------------------------- HYDRA -----------------------------------------
defaults:  
  - _self_                                   
  - override hydra/hydra_logging: disabled   # Отключаем логирование hydra
  - override hydra/job_logging: custom        # Переопределяем логирование hydra

hydra:
  output_subdir: null
  run:  
    dir: .       # Путь до папки с файлами аутпута гидры

#----------------------------------------------GENERAL----------------------------------------
backend_api_base_url: "${oc.env:BACKEND_API_BASE_URL}"

save_to_images_temp: True # Сохранять ли кадры в папку images_temp

# -----------------------------------------------VIDEO----------------------------------------

cam_id: 1 # ID камеры AutoIncrement В Базе Данных
local_video_path: "Test_Videos/camera1_cut_1.mp4"

#----------------------------------------VIDEO_VISUALIZATION----------------------------------

show_fps: True  # Показывать ли FPS
color_fps: [100, 255, 0] # Цвет FPS

preview_screen_size:
  width: 1024
  height: 768
show_video_preview: True  # Показывать окно с видео
video_visual_name: "VIDEO_EVENTS" # Название окна с видео
font: cv2.FONT_HERSHEY_COMPLEX # Шрифт для текста

#----------------------------------------------KAFKA------------------------------------------
kafka_enabled: False  # В локальном режиме Kafka отключаем
topic_name: "cam_id_1" # Название топика в Kafka
kafka_address: "${oc.env:KAFKA_ADDRESS}" # Адресс по которому находится Kafka
group_id: "video-consumer-group" # Группа потребителей Kafka
consumer_timeout: 1000 # Тайм-аут для ожидания новых сообщений для Kafka Consumer

#--------------------------------------------INFERENCE----------------------------------------
skip_frames: True
target_fps: 25 # Целевой FPS
c: 50 # Размер очереди кадров

# Вычислять объекты или нет
pj_enabled: True # Определять ли людей в кадре
lwt_enabled: True # Определять ли вагоны в кадре
r_enabled: True # Определять ли рельсы в кадре\

# Токен для записи snapshots в API
token: "${oc.env:TOKEN}"
# Логин и пароль от учетной записи с ролью ai
login: "${oc.env:LOGIN}"
password: "${oc.env:PASSWORD}"

rails_unet: True # Использовать ли модель Rails Unet

rails_cache: True # Использовать ли кэш рельсов
rail_cache_update_interval: 5 # Интервал в кадрах, через который обновляется кэш рельсов

model_pj: "Weights/PJ_v_2_2.pt"   # Путь до весов модели PJ Yolo
model_lwt: "Weights/LWT_v_1_4.pt"  # Путь до весов модели LWT Yolo
model_r: "Weights/R_v_2_3.pt"      # Путь до весов модели R Yolo
model_r_unet: "Weights/R_v_2_3_Unet.onnx" # Путь до весов модели R Unet
model_world: "Weights/yolov8m-worldv2.pt" # Путь до весов модели YOLO WORLD

# Параметры инференса моделей
pj_model_params: # Параметры модели PJ 
  iou: 0.5
  conf: 0.5
  imgsz: 640
  verbose: False

lwt_model_params: # Параметры модели LWT
  iou: 0.25
  conf: 0.7
  imgsz: 640
  verbose: False

rail_model_params: # Параметры модели Rails
  iou: 0.5
  conf: 0.4
  imgsz: 640
  verbose: False
  area_ratio: 0.002

r_unet_params:
  area_ratio: 0.002
  threshold: 0.4
  imgsz_unet: [384, 384]

world_model_params: # Параметры модели YOLO WORLD
  iou: 0.5
  conf: 0.03
  imgsz: 640
  verbose: False

#--------------------------------------------TRACKING----------------------------------------

track_timeout: 15 # Время в сек, через которое трек считается умершим

tracking_params:
  tracker: "src/config/bytetrack.yaml"
  track_history_len: 100
  velocity_ema_start: 10
  velocity_ema_alpha: 0.9
  dir_ema_alpha: 0.2

velocity_correction_params:
  enabled: True
  velocity_corr_history_len: 20
  abrupt_change_diff: 3 # Порог для резкого изменения скорости
  IoU_thrd: 0.95 # Порог для IoU
  distance_thrd_hard: 0.3 # Порог для дистанции (доля от velocity_corr_history_len)
  abrupt_change_sum: 4 # Порог для суммы резких изменений скорости (часть от velocity_corr_history_len)
  IoU_small_share: 0.6 # Доля IoU детекции с самой превышающая порог
  multidirectional: 6 # Порог для количества разнонаправленых движений (часть от velocity_corr_history_len)
  distance_thrd_soft: 1.5 # Мягкий Порог для дистанции (доля от velocity_corr_history_len)

velocity_params:
  show_velocity: False  # Показывать ли скорость
  color_velocity: [0, 171, 255] # orange brg
  thick_velocity: 2
  fontscale_velocity: 0.8

#-----------------------------------------INFERENCE_VISUALIZATION------------------------------------
show_lwt: True  # Показывать ли объекты класса LWT
show_pj: True  # Показывать ли объекты класса PJ

visualize_inference_params:
  show_mask: False  # Показывать ли сементационную маску 
  show_class: True  # Показывать ли класс объекта
  colors_classes: #цвета для классов в формате bgr.
    person: [0, 153, 0] # green
    jacket: [0, 171, 255] # orange
    locomotive: [0, 0, 255] # red
    wagon: [255, 128, 0] # blue 
    tank: [204, 204, 255] # pink
    rail: [255, 0, 255] # magenta
    foreign_objects: [205, 90, 106] # SlateBlue
  thickness: 2
  alpha: 0.5
  fontscale: 1

show_rails: True  # Показывать ли рельсы

visualize_r_unet_params:
  show_mask: False  # Показывать ли сементационную маску 
  show_class: True  # Показывать ли класс объекта
  color: [255, 0, 255] # magenta
  thickness: 2
  fontscale: 1
  alpha: 0.5

#----------------------------------------BUSINESS_TASKS----------------------------------------

# Общие параметры для всех задач
move_velocity_lwt: 0.8 # Порог скорости для определения движения поезда
move_velocity_p: 0.4 # Порог скорости для определения движения человека

# ЗАДАЧА 1.2 'Определение сотрудника в опасной зоне'
task_1_2_enabled: False  # Включить ли задачу 1.2
task_1_2_params:
  danger_zone_thrsd: 0.5 # Порог для определения нахождения в опасной зоне
  feet_ratio: 0.95 # Порог для определения нахождения ног человека
  color_danger: [0, 0, 255] # red brg
  color_safe: [102, 204, 0] # green brg
  fontscale: 1 # Размер шрифта
  thickness: 2 # Толщина линии

#***************************************************************************************
# ЗАДАЧА 1.3 'Определение сотрудника без СИЗ'
task_1_3_enabled: False  # Включить ли задачу 1.3
task_1_3_params:
  threshold_pj: 0.05 # Порог для определения нахождения без СИЗ
  color_ok: [102, 204, 0] # green brg
  color_no: [0, 0, 255] # red brg
  fontscale: 1 # Размер шрифта
  thickness: 2 # Толщина линии

#***************************************************************************************
# ЗАДАЧА 3.1 'Спрыгивание с подвижного состава, платформы'
task_3_1_enabled: False  # Включить ли задачу 3.1

task_3_1_params:
  feet_wagon_intersections_history_len: 40 # Длина истории хранимых пересечений человека с движущимся вагоном
  feet_ratio: 0.95 # Порог для определения нахождения ног человека
  threshold_ioa: 0.3 # Порог для определения, пересекают ли ноги движущийся вагон
  show_task: True
  alert_text: "Человек спрыгнул с подвижного состава"
  color_alert: [0, 0, 255] # red bgr
  txt_up_alert: 15 # Смещение текста вверх
  fontscale_alert: 1.2  # Размер шрифта
  thick_alert: 2 # Толщина линии

#***************************************************************************************
# ЗАДАЧА 3.3 'Проезд сотрудника на подножке, наружной лестнице цистерны, совмещенной с подножкой'
task_3_3_enabled: False  # Включить ли задачу 3.3

task_3_3_params:
  atol_velocity: 3 # Погрешность для определения схожести скоростей человека и вагона
  threshold_ioa: 0.3 # Порог для определения нахождения на подножке
  feet_ratio: 0.95 # Порог для определения нахождения ног человека
  show_task: True # Отображать ли сообщение алерта на кадре
  alert_text: "Человек зацепился за вагон" # Текст для алерта
  color_alert: [0, 171, 255] # orange brg
  txt_up_alert: 15 # Смещение текста вверх
  fontscale_alert: 1.2  # Размер шрифта
  thick_alert: 2 # Толщина линии

#***************************************************************************************
# ЗАДАЧА 4.2 'Переход через железнодорожный путь перед движущимся подвижным составом'
task_4_2_enabled: False  # Включить ли задачу 4.2

task_4_2_params:
  threshold_ioa: 0.3 # Порог для определения, пересекает ли человек рельсы
  thrld_dist_w_r: 0.33 # Доля от высоты вагона - максимальное расстояние на котором должен находиться центр персечения рельсы и вагона
  feet_ratio: 0.95 # Порог для определения нахождения ног человека
  alert_text: "Человек переходит рельсы после начала движения вагона" # Текст для алерта 4.2
  color_alert: [0, 0, 255] # Красный цвет алерта в BGR
  txt_up_alert: 20
  fontscale_alert: 1.0
  thick_alert: 2
  show_task: True # Отображать ли сообщение алерта на кадре
  show_debug: False # Показывать ли отладочную информацию

#***************************************************************************************
# ЗАДАЧА 5.2 'Переход пути вблизи стоящего состава на расстоянии менее 5 метров с головы или хвоста состава'
task_5_2_enabled: False  # Включить ли задачу 5.2

task_5_2_params:
  alert_distance: 5.0 # Кол-во метров до вагона, меньше которых срабатывает событие
  thrd_ioa_p_r: 0.3 # Порог для определения, пересекает ли человек рельсы
  thrld_dist_w_r: 0.33 # Доля от высоты вагона - максимальное расстояние на котором должен находиться центр персечения рельсы и вагона
  feet_ratio: 0.95 # Порог для определения нахождения ног человека
  alert_text: "Человек переходит перед вагоном ближе 5 метров" # Текст для алерта 5.2
  color_alert: [0, 0, 255] # Красный цвет алерта в BGR
  txt_up_alert: 20
  fontscale_alert: 1.0
  thick_alert: 2
  show_task: True # Отображать ли сообщение алерта на кадре
  show_debug: False # Показывать ли отладочную информацию

#***************************************************************************************
# ЗАДАЧА 6.1 'Пролезание работников под стоящими вагонами'
task_6_1_enabled: False  # Включить ли задачу 6.1
task_6_1_params:
  task_6_1_show: True # Отображать ли алерт на задачу 6.1
  time_absent_6_1: 4 # Время отсутствия объекта в кадре
  edge_threshold: 50 # Порог для определения выхода объекта за границы кадра
  thrd_ioa: 0.1 # Порог для ioa человека и вагона
  alert_text_6_1: "Исчез за вагоном!" # Текст для алерта 6.1
  text_up: 20 # Смещение текста вверх
  color: [0, 0, 255] # Красный цвет алерта в BGR
  fontscale: 1 # Размер шрифта
  thickness: 2 # Толщина линии

#***************************************************************************************
# ЗАДАЧА 7: Идентификация пересечений ЖД- путей в запрещенных местах или по опасной траектории
task_7_enabled: False  # Включить ли задачу 7
task_7_1_enabled: False  # Включить ли задачу 7.1

task_7_params:
  feet_ratio: 0.97 # Порог для определения нахождения ног человека
  thrd_ioa_p_r: 0.5 # Порог для ioa человека и рельсов
  color_danger: [0, 0, 255] # red brg
  color_safe: [102, 204, 0] # green brg
  start_track_7: 3 # количество записей скорости по которому определяется стоит ли объект (если все n значений выше порога, то значит объект движется)
  direction_calc_buffer: 15  # количество записей скорости по которому определяется направление движения
  thrd_angle_7_2_1: 25  # Порог для угла между вектором движения и вектором ЖД путей
  show_task_7_2_2: True # Показывать ли алерт 7.2.2
  show_task_7_2_1: True # Показывать ли алерт 7.2.1
  text_up_7: 20 # Смещение текста вверх
  alert_text_7_1: 'На ЖД путях в опасной зоне!' # Текст для алерта 7.1
  alert_text_7_2_1: 'по ЖД путям вдоль рельсов!' # Текст для алерта 7.2.1
  alert_text_7_2_2: 'Стоит на ЖД путях!'  # Текст для алерта 7.2.2
  color_alert: [0, 0, 255] # red brg
  fontscale: 1 # Размер шрифта
  thickness: 2 # Толщина линии
  filter_rails: False # фильтровать ли рельсы
  r_p_filter_scale: 15 # Радиус фильтрации полигона рельсов определяется как высота ног человека, умноженная на коэффициент r_p_filter_scale
  show_debug: False # Показывать ли отладочную информацию

#***************************************************************************************
# ЗАДАЧА 6.2 'Залезание работников на автосцепки или под них '
task_6_2_enabled: False  # Включить ли задачу 6.2

# ЗАДАЧА 8.1.1: Определение работников, сидящих в зоне наблюдения
task_8_1_1_enabled: False  # Включить ли задачу 8.1

task_6_2_and_8_1_1_params:
  task_6_2_show: True # Отображать ли алерт на задачу 6.2
  task_8_1_1_show: True # Отображать ли алерт на задачу 8.1.1
  wagon_mask: True # Использовать ли маску вагона
  buffer_len_6_2: 2 # Длина буфера перед алертом 6.2
  buffer_len_8_1_1: 30 # Длина буфера перед алертом 8.1.1
  thrd_ioa: 0.75 # Порог для ioa человека и вагона
  thrd_p_hw_6_2: 0.55 # Порог для отношения ш/в bbox для пролезания под вагонами
  thrd_p_hw_8_1_1: 0.6 # Порог для отношения ш/в bbox для сидящих работников
  thrd_p_hw_8_1_1_down: 0.8 # Верхний порог для отсева ложн. срабатываний
  show_p_hw: False # Показывать ли отношение ш/в bbox
  alert_text_6_2: "Человек под вагоном!" # Текст для алерта 6.2
  alert_text_8_1_1: 'Человек опасно сидит!' # Текст для алерта 8.1.1
  text_up: 20 # Смещение текста вверх
  color: [0, 171, 255] # orange brg
  fontscale: 1 # Размер шрифта
  thickness: 2 # Толщина линии

#***************************************************************************************
# ЗАДАЧА 9 'Обнаружение посторонних предметов в заданной зоне'
task_9_enabled: False # Включить ли задачу 9
task_9_show: True # Отображать ли рамки классов посторонних предметов в задаче 9

text_prompts: [
                "opened box on the ground",
                "black plastic garbage bag on the ground", "backpack on the ground",
]  # Промты для YOLO WORLD
world_time_interval: 0.0 # Интервал в сек., через который идет инференс модели YOLO WORLD

#***************************************************************************************
# ЗАДАЧА 10.1: Определение нехарактерного положения (падение) работника
task_10_1_enabled: False  # Включить ли задачу 10.1
task_10_1_params:
  task_10_1_show: True # Отображать ли алерт на задачу 10.2
  alert_text_10_1: 'Человек лежит!' # Текст для алерта 10.2
  thrd_phw_10_1: 0.8 # Порог для определения падения
  text_up: 20 # Смещение текста вверх
  color: [0, 0, 255] # red brg
  fontscale: 1.2 # Размер шрифта
  thickness: 2 # Толщина линии

#***************************************************************************************
# ЗАДАЧА 10.2: Наличие признаков девиантного поведения (походка)
task_10_2_enabled: False  # Включить ли задачу 10.2

task_10_2_params:
  task_10_2_show: True # Отображать ли алерт на задачу 10.2
  buffer_len_10_2: 50 # Длина буфера для расчета признаков девиантного поведения
  buffer_len_results_10_2: 200 # Длина буфера для хранения признаков девиантного поведения
  deviant_thrlds:
    deviant_score: 1.9 # Пороговое значение девиантного поведения
    p_height: 40 # высота bbox человека
    sitting: 0.6 # Порог сидящего человека (не девиантное)
    sitting_buffer: 30 # Размер буфера для проверки сидячего положения
    distance: 0.2 # Порог пройденного расстояния
    intersection_threshold: 0.4 # Порог пересечения с вагоном 
    velocity_weight: 0.55 # Вес скорости в расчете девиантного поведения
    height_factor: 115 # Фактор нормализации высоты  человека
    deviant_threshold: 0.6 #  Порог доли из истории проходящей порог deviant_score
  alert_text_10_2: 'Девиантная походка!' # Текст для алерта 10.2
  text_up: 40 # Смещение текста вверх
  color: [0, 0, 255] # red brg
  fontscale: 1 # Размер шрифта
  thickness: 2 # Толщина линии
  show_debug: False # Показывать ли отладочную информацию

#--------------------------------------------DATA_BASE----------------------------------------
db_enabled: False # Включать ли логику записи логов в БД
db_check_time: 20 # Промежуток в сек, через который идет запись в БД, если есть новые логи
triggers_count: 10 # Значение счетчика срабатываний бизнес-логики, после которого информация о срабатывании будет записана в БД
triggers_count_task_4_2: 3 # Значение счетчика срабатываний бизнес-логики 4.2
triggers_count_task_5_2: 3 # Значение счетчика срабатываний бизнес-логики 5.2
check_danger_zones_cords_delay: 20 # Кол-во секунд, через которые повторяется чтение координат опасных зон
