# --------------------------------------------- HYDRA -----------------------------------------
defaults:  
  - _self_                                   
  - override hydra/hydra_logging: disabled   # Disable Hydra logic
  - override hydra/job_logging: custom        # Reshaping Hydra's Login

hydra:
  output_subdir: null
  run:  
    dir: .       # Path to a folder with a subpoena of hydraulics

#----------------------------------------------GENERAL----------------------------------------
backend_api_base_url: "${oc.env:BACKEND_API_BASE_URL}"

save_to_images_temp: True # Do you want to save the images in the images_temp folder?

# -----------------------------------------------VIDEO----------------------------------------

cam_id: 1 # AutoIncrement ID in Database Data
local_video_path: "Test_Videos/camera1_cut_1.mp4"

#----------------------------------------VIDEO_VISUALIZATION----------------------------------

show_fps: True  # Show FPS
color_fps: [100, 255, 0] # FPS Color

preview_screen_size:
  width: 1024
  height: 768
show_video_preview: True  # Show video window
video_visual_name: "VIDEO_EVENTS" # Video window name
font: cv2.FONT_HERSHEY_COMPLEX # Text font

#----------------------------------------------KAFKA------------------------------------------
kafka_enabled: False  # In local mode, Kafka is disabled.
topic_name: "cam_id_1" # Kafka top name
kafka_address: "${oc.env:KAFKA_ADDRESS}" # The address to which Kafka is located
group_id: "video-consumer-group" # Kafka Consumer Group
consumer_timeout: 1000 # Timeout to wait for new messages for Kafka Consumer

#--------------------------------------------INFERENCE----------------------------------------
skip_frames: True
target_fps: 25 # Target FPS
c: 50 # Number of staff

# Compute objects or not
pj_enabled: True # Whether to identify people in the frame
lwt_enabled: True # Do you want to identify the cars in the frame?
r_enabled: True # Do you want to determine the rails in the frame?

# Snapshot Token in API
token: "${oc.env:TOKEN}"
# Login and password for the ai account
login: "${oc.env:LOGIN}"
password: "${oc.env:PASSWORD}"

rails_unet: True # Whether to use the Rails Internet model

rails_cache: True # Use the cache rails
rail_cache_update_interval: 5 # The frame interval through which the cache rails are updated

model_pj: "Weights/PJ_v_2_2.pt"   # Path to PJ Yolo Weights
model_lwt: "Weights/LWT_v_1_4.pt"  # Path to LWT Yolo weights
model_r: "Weights/R_v_2_3.pt"      # Path to R Yolo weights
model_r_unet: "Weights/R_v_2_3_Unet.onnx" # The way to the R-Unet weightings
model_world: "Weights/yolov8m-worldv2.pt" # Path to YOLO WORLD Weights

# Model Inference Options
pj_model_params: # PJ model parameters 
  iou: 0.5
  conf: 0.5
  imgsz: 640
  verbose: False

lwt_model_params: # LWT model parameters
  iou: 0.25
  conf: 0.7
  imgsz: 640
  verbose: False

rail_model_params: # Rails Model Options
  iou: 0.5
  conf: 0.4
  imgsz: 640
  verbose: False
  area_ratio: 0.002

r_unet_params:
  area_ratio: 0.002
  threshold: 0.4
  imgsz_unet: [384, 384]

world_model_params: # YOLO WORLD model parameters
  iou: 0.5
  conf: 0.03
  imgsz: 640
  verbose: False

#--------------------------------------------TRACKING----------------------------------------

track_timeout: 15 # Time in sec, through which track is considered dead

tracking_params:
  tracker: "src/config/bytetrack.yaml"
  track_history_len: 100
  velocity_ema_start: 10
  velocity_ema_alpha: 0.9
  dir_ema_alpha: 0.2

velocity_correction_params:
  enabled: True
  velocity_corr_history_len: 20
  abrupt_change_diff: 3 # Speed threshold
  IoU_thrd: 0.95 # IoU threshold
  distance_thrd_hard: 0.3 # Distance threshold (rate of velocity_corr_history_len)
  abrupt_change_sum: 4 # Threshold for summation of sharp speed changes (part of velocity_corr_history_len)
  IoU_small_share: 0.6 # Iou share of detectives with the highest threshold
  multidirectional: 6 # Threshold for the number of different directional movements (part of velocity_corr_history_len))
  distance_thrd_soft: 1.5 # Smooth distance threshold (rate of velocity_corr_history_len))

velocity_params:
  show_velocity: False  # Show speed
  color_velocity: [0, 171, 255] # orange brg
  thick_velocity: 2
  fontscale_velocity: 0.8

#-----------------------------------------INFERENCE_VISUALIZATION------------------------------------
show_lwt: True  # Show LWT objects
show_pj: True  # Show PJ objects

visualize_inference_params:
  show_mask: False  # Show Cement Mask 
  show_class: True  # Show object class
  colors_classes: # Colors for classes in bgr format.
    person: [0, 153, 0] # green
    jacket: [0, 171, 255] # orange
    locomotive: [0, 0, 255] # red
    wagon: [255, 128, 0] # blue 
    tank: [204, 204, 255] # pink
    rail: [255, 0, 255] # magenta
    foreign_objects: [205, 90, 106] # SlateBlue
  thickness: 2
  alpha: 0.5
  fontscale: 1

show_rails: True  # Show rails

visualize_r_unet_params:
  show_mask: False  # Show Cement Mask 
  show_class: True  # Show object class
  color: [255, 0, 255] # magenta
  thickness: 2
  fontscale: 1
  alpha: 0.5

#----------------------------------------BUSINESS_TASKS----------------------------------------

# General parameters for all tasks
move_velocity_lwt: 0.8 # Speed threshold for determining train traffic
move_velocity_p: 0.4 # Speed threshold for determining human movement

# OBJECTIVE 1.2 "Identification of a staff member in a hazardous area"
task_1_2_enabled: False  # Do you want to use 1.2
task_1_2_params:
  danger_zone_thrsd: 0.5 # The threshold for determining the location of a danger zone
  feet_ratio: 0.95 # The threshold for determining a person &apos; s legs
  color_danger: [0, 0, 255] # red brg
  color_safe: [102, 204, 0] # green brg
  fontscale: 1 # Floating Size
  thickness: 2 # Line thickness

#***************************************************************************************
# OBJECTIVE 1.3 "Designation of a staff member without PPE"
task_1_3_enabled: False  # Do you want to use 1.3
task_1_3_params:
  threshold_pj: 0.05 # The threshold for determination of the absence of PPE
  color_ok: [102, 204, 0] # green brg
  color_no: [0, 0, 255] # red brg
  fontscale: 1 # Floating Size
  thickness: 2 # Line thickness

#***************************************************************************************
# OBJECTIVE 3.1 'Jumping from rolling stock, platforms'
task_3_1_enabled: False  # Do you want to use 3.1

task_3_1_params:
  feet_wagon_intersections_history_len: 40 # The length of the history of the stored crossings of a person with a moving wagon
  feet_ratio: 0.95 # The threshold for determining a person &apos; s legs
  threshold_ioa: 0.3 # The threshold for determining whether a moving wagon crosses its legs
  show_task: True
  alert_text: "The man jumped off the rolling stock."
  color_alert: [0, 0, 255] # red bgr
  txt_up_alert: 15 # Upshift
  fontscale_alert: 1.2  # Floating Size
  thick_alert: 2 # Line thickness

#***************************************************************************************
# OBJECTIVE 3.3 'Travel of a staff member on a step, outside staircase of a tank reciprocally incorporated with a step̆'
task_3_3_enabled: False  # Do you want to use 3.3

task_3_3_params:
  atol_velocity: 3 # Accuracy to determine the similarities between human speeds and the wagon
  threshold_ioa: 0.3 # The threshold for determining whether or not to be on the step
  feet_ratio: 0.95 # The threshold for determining a person &apos; s legs
  show_task: True # Do you want to show the allert's message on the frame?
  alert_text: "The man caught on the car." # Alert text
  color_alert: [0, 171, 255] # orange brg
  txt_up_alert: 15 # Upshift
  fontscale_alert: 1.2  # Floating Size
  thick_alert: 2 # Line thickness

#***************************************************************************************
# TASK 4.2 'Transiting the railway track to moving rolling rolling stock'
task_4_2_enabled: False  # Do you want to use 4.2

task_4_2_params:
  threshold_ioa: 0.3 # The threshold for determining whether a person crosses rails
  thrld_dist_w_r: 0.33 # Proportion of the height of the wagon - maximum distance on which the centre of the railing and the wagon shall be situated
  feet_ratio: 0.95 # The threshold for determining a person &apos; s legs
  alert_text: "Man passes the rails when the wagon starts moving." # Text for 4.2
  color_alert: [0, 0, 255] # Red allerte colour in BGR
  txt_up_alert: 20
  fontscale_alert: 1.0
  thick_alert: 2
  show_task: True # Do you want to show the allert's message on the frame?
  show_debug: False # Show debug information

#***************************************************************************************
# OBJECTIVE 5.2 = Transition near a standing convoy less than 5 m from the head or tail of the convoy'
task_5_2_enabled: False  # Do you want to use 5.2

task_5_2_params:
  alert_distance: 5.0 # How many metres to the wagon, less of which the event works
  thrd_ioa_p_r: 0.3 # The threshold for determining whether a person crosses rails
  thrld_dist_w_r: 0.33 # Proportion of the height of the wagon - maximum distance on which the centre of the railing and the wagon shall be situated
  feet_ratio: 0.95 # The threshold for determining a person &apos; s legs
  alert_text: "A man passes in front of a wagon less than 5 meters." # Text for 5.2
  color_alert: [0, 0, 255] # Red allerte colour in BGR
  txt_up_alert: 20
  fontscale_alert: 1.0
  thick_alert: 2
  show_task: True # Do you want to show the allert's message on the frame?
  show_debug: False # Show debug information

#***************************************************************************************
# TASK 6.1 'Slips of workers under standing wagons'
task_6_1_enabled: False  # Do you want to use 6.1
task_6_1_params:
  task_6_1_show: True # Show allert to task 6.1
  time_absent_6_1: 4 # Time of absence of object in frame
  edge_threshold: 50 # The threshold for determining the exit of an object beyond the frame
  thrd_ioa: 0.1 # Threshold for man and car
  alert_text_6_1: "He's gone behind the car!" # Text for 6.1
  text_up: 20 # Upshift
  color: [0, 0, 255] # Red allerte colour in BGR
  fontscale: 1 # Floating Size
  thickness: 2 # Line thickness

#***************************************************************************************
# QUESTION 7: Identification of intersections of roads in prohibited places or in a dangerous trajectory
task_7_enabled: False  # Whether to include task 7
task_7_1_enabled: False  # Do you want to use 7.1

task_7_params:
  feet_ratio: 0.97 # The threshold for determining a person &apos; s legs
  thrd_ioa_p_r: 0.5 # The threshold for man and rails
  color_danger: [0, 0, 255] # red brg
  color_safe: [102, 204, 0] # green brg
  start_track_7: 3 # the number of speed records by which it is determined whether an object is worth (if all n values are above the threshold, then the object moves)
  direction_calc_buffer: 15  # Number of speed records for which the direction of traffic is determined
  thrd_angle_7_2_1: 25  # Threshold for angle between traffic vector and CW vector of tracks
  show_task_7_2_2: True # Show 7.2.2
  show_task_7_2_1: True # Show 7.2.1
  text_up_7: 20 # Upshift
  alert_text_7_1: "On the roads in the danger zone!" # Text for 7.1
  alert_text_7_2_1: "On the roads along the rails!" # Text for 7.2.1
  alert_text_7_2_2: "Standing on the tracks!"  # Text for 7.2.2
  color_alert: [0, 0, 255] # red brg
  fontscale: 1 # Floating Size
  thickness: 2 # Line thickness
  filter_rails: False # filter rails
  r_p_filter_scale: 15 # The irradiation radius of the rail area is defined as the height of human feet multiplied by the factor r_p_filter_scale
  show_debug: False # Show debug information

#***************************************************************************************
# TASK 6.2 'Climbing or Undercoming Workers '
task_6_2_enabled: False  # Do you want to use 6.2

# OBJECTIVE 8.1.1: Definition of employees sitting in the observation zone
task_8_1_1_enabled: False  # Do you want to use 8.1

task_6_2_and_8_1_1_params:
  task_6_2_show: True # Show allert to task 6.2
  task_8_1_1_show: True # Show allert to task 8.1.1
  wagon_mask: True # Do you want to use a car mask?
  buffer_len_6_2: 2 # Back length in front of 6.2 allerate
  buffer_len_8_1_1: 30 # Back length in front of 8.1.1 allerate
  thrd_ioa: 0.75 # Threshold for man and car
  thrd_p_hw_6_2: 0.55 # Threshold for the c/bbox ratio for climbing under the wagons
  thrd_p_hw_8_1_1: 0.6 # S/s bbox threshold for seated employees
  thrd_p_hw_8_1_1_down: 0.8 # Top drop-out threshold is false.
  show_p_hw: False # Whether to display the ratio of n/a bbox
  alert_text_6_2: "The man under the car!" # Text for 6.2
  alert_text_8_1_1: "A man sits dangerous!" # Text for 8.1.1
  text_up: 20 # Upshift
  color: [0, 171, 255] # orange brg
  fontscale: 1 # Floating Size
  thickness: 2 # Line thickness

#***************************************************************************************
# QUESTION 9 "Detecting foreign objects in a given area'
task_9_enabled: False # Do you want to include task 9
task_9_show: True # Whether to display the boundaries of the classes of foreign subjects in task 9

text_prompts: [
                "opened box on the ground",
                "black plastic garbage bag on the ground", "backpack on the ground",
]  # YOLO WORLD Promise
world_time_interval: 0.0 # Interval in the sec, through which the YOLO WORLD inference goes

#***************************************************************************************
# OBJECTIVE 10.1: Determination of the employee &apos; s non-maintenance (fall)
task_10_1_enabled: False  # Do you want to use 10.1
task_10_1_params:
  task_10_1_show: True # Show allert to task 10.2
  alert_text_10_1: "The man is lying down!" # Text for 10.2
  thrd_phw_10_1: 0.8 # Threshold to determine fall
  text_up: 20 # Upshift
  color: [0, 0, 255] # red brg
  fontscale: 1.2 # Floating Size
  thickness: 2 # Line thickness

#***************************************************************************************
# OBJECTIVE 10.2: Evidence of deviant behaviour)
task_10_2_enabled: False  # Do you want to use 10.2

task_10_2_params:
  task_10_2_show: True # Show allert to task 10.2
  buffer_len_10_2: 50 # Length of buffer to calculate signs of deviant behaviour
  buffer_len_results_10_2: 200 # Length of buffer to store signs of deviant behaviour
  deviant_thrlds:
    deviant_score: 1.9 # Threshold value of deviant behaviour
    p_height: 40 # bbox height
    sitting: 0.6 # Sitting-person threshold (not a deviation)
    sitting_buffer: 30 # Size of buffer to check seating position
    distance: 0.2 # Threshold of distance travelled
    intersection_threshold: 0.4 # Level of intersection with wagon 
    velocity_weight: 0.55 # Weight of speed in calculation of deviant behaviour
    height_factor: 115 # Human Height Normalization Factor
    deviant_threshold: 0.6 # Threshold of a fraction of the history of the passing deviant_score threshold
  alert_text_10_2: "It's a deviant walk!" # Text for 10.2
  text_up: 40 # Upshift
  color: [0, 0, 255] # red brg
  fontscale: 1 # Floating Size
  thickness: 2 # Line thickness
  show_debug: False # Show debug information

#--------------------------------------------DATA_BASE----------------------------------------
db_enabled: False # Whether to incorporate log logic into the database
db_check_time: 20 # The sedation through which the database entry goes if there are new logs
triggers_count: 10 # Business logic counter value, after which activation information will be recorded in the database
triggers_count_task_4_2: 3 # Business logic counter value 4.2
triggers_count_task_5_2: 3 # Business logic counter value 5.2
check_danger_zones_cords_delay: 20 # Number of seconds after which the reading of the coordinates of the hazardous areas is repeated
